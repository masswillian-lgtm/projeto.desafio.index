<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jogo-container">
        <h1>Jogo da Adivinhação</h1>
        <p>Tente adivinhar o número secreto entre 1 e 100.</p>
        <p id="tentativas-restantes">Tentativas restantes: 5</p>
        
        <div class="entrada-grupo">
            <input type="number" id="palpite" placeholder="Digite seu palpite" min="1" max="100">
            <button id="btn-enviar">Palpitar</button>
        </div>

        <p id="mensagem" class="mensagem"></p>
        <button id="btn-reiniciar" style="display: none;">Jogar Novamente</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
